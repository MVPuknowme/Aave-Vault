name: Report gas diff

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  compare_gas_reports:
    runs-on: ubuntu-latest
    env:
      POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
      AVALANCHE_RPC_URL: ${{ secrets.AVALANCHE_RPC_URL }}
      ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
      FOUNDRY_FUZZ_SEED: 0x${{ github.event.pull_request.base.sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: onbjerg/foundry-toolchain@v1
        with:
          version: stable

      - name: Run non-fork gas tests
        run: |
          forge test --gas-report \
            --no-match-contract '(Fork|RewardsClaim|Edge|Upgrade)' \
            | tee gasreport.ansi

      - name: Run fork gas tests
        if: env.POLYGON_RPC_URL != '' && env.AVALANCHE_RPC_URL != ''
        run: |
          forge test --gas-report \
            --match-contract '(Fork|RewardsClaim|Edge|Upgrade)' \
            | tee -a gasreport.ansi

      - name: Report skipped fork gas tests
        if: env.POLYGON_RPC_URL == '' || env.AVALANCHE_RPC_URL == ''
        run: |
          echo "::warning title=Fork gas tests skipped::Missing POLYGON_RPC_URL or AVALANCHE_RPC_URL. Non-fork gas report was generated."
          {
            echo "# Fork gas tests skipped"
            echo
            echo "Non-fork Foundry gas tests completed, but fork-dependent tests were skipped because one or more RPC secrets are missing."
            echo
            echo "Required repository secrets:"
            echo "- POLYGON_RPC_URL"
            echo "- AVALANCHE_RPC_URL"
            echo "- ETHEREUM_RPC_URL, if tests require Ethereum forks"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare gas reports
        uses: Rubilmax/foundry-gas-diff@v3.21
        with:
          sortCriteria: avg,max
          sortOrders: desc,asc
          ignore: test/**/*
        id: gas_diff

      - name: Add gas diff to sticky comment
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          delete: ${{ !steps.gas_diff.outputs.markdown }}
          message: ${{ steps.gas_diff.outputs.markdown }}

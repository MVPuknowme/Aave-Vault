name: certora

on:
  push:
    branches:
      - main
      - certora
  pull_request:
    branches:
      - main
      - certora
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certora-key:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Certora key
        id: check
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: |
          if [[ -n "$CERTORAKEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Certora skipped::CERTORAKEY is not configured."
            {
              echo "# Certora verification skipped"
              echo
              echo "Add the CERTORAKEY repository secret to enable formal verification."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    needs: certora-key
    if: needs.certora-key.outputs.available == 'true'
    runs-on: ubuntu-latest
    env:
      CERTORAKEY: ${{ secrets.CERTORAKEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install Certora CLI
        run: pip3 install certora-cli==7.26.0

      - name: Install solc
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.10/solc-static-linux
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc8.10

      - name: Verify rule ${{ matrix.rule }}
        run: |
          cd certora
          touch applyHarness.patch
          make munged
          cd ..
          certoraRun certora/conf/${{ matrix.rule }}

    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        rule:
          - changeInContractBalanceShouldCauseAccrual.conf
          - erc4626-previewOPERATIONS.conf
          - fees_LEQ_ATokenBal.conf
          - lastVaultBalance_LEQ_ATokenBalThis.conf
          - positiveSupply_imply_positiveAssets-deposit.conf
          - positiveSupply_imply_positiveAssets-mint.conf
          - positiveSupply_imply_positiveAssets-other.conf
          - positiveSupply_imply_positiveAssets-redeem.conf
          - positiveSupply_imply_positiveAssets-withdraw.conf
          - rayMul_rayDiv_mulDiv_properties.conf
          - totalSupply_EQ_sumAllBal.conf
          - accrueYieldCheck.conf

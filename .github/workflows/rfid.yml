name: RFID utility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run RFID utility tests
        run: python -m unittest discover -s tests -p 'test_rfid_tool.py' -v
